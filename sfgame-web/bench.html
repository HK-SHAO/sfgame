<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>造风 · 性能诊断</title>
    <style>
      html {
        font-size: 16px;
      }
      body {
        margin: 0;
        padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
        font-family: -apple-system, 'PingFang SC', system-ui, sans-serif;
        background: #fff8ea;
        color: #3d3427;
      }
      h1 {
        font-size: 1.15rem;
        margin: 0.2rem 0 0.6rem;
      }
      #status {
        font-size: 0.8rem;
        line-height: 1.5;
        color: #6b5b45;
        margin-bottom: 0.8rem;
        word-break: break-all;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
        background: #fffdf7;
        border-radius: 12px;
        overflow: hidden;
      }
      th, td {
        padding: 0.45rem 0.5rem;
        text-align: left;
        border-bottom: 1px solid #eee1c8;
      }
      th {
        font-weight: 600;
        color: #8a7a5f;
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .detail {
        color: #a09277;
        font-size: 0.72rem;
      }
      td.ok {
        color: #2fbf71;
      }
      td.warm {
        color: #d99a2b;
      }
      td.hot {
        color: #e05a3a;
        font-weight: 700;
      }
      .btns {
        margin-top: 0.9rem;
        display: flex;
        gap: 0.6rem;
      }
      button {
        font-size: 0.9rem;
        padding: 0.55rem 1.1rem;
        border-radius: 999px;
        border: 1px solid #d8c193;
        background: #fff;
        color: #3d3427;
      }
      button:active {
        background: #f3e8cf;
      }
      .note {
        margin-top: 0.9rem;
        font-size: 0.72rem;
        color: #a09277;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h1>造风 · 性能诊断</h1>
    <div id="status">准备中…</div>
    <table>
      <thead>
        <tr>
          <th>组件</th>
          <th class="num">mean ms</th>
          <th class="num">p95 ms</th>
          <th class="num">帧预算</th>
          <th>说明</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
    <div class="btns">
      <button id="copy" hidden>复制报告</button>
      <button id="rerun" hidden>重新运行</button>
    </div>
    <p class="note">
      测量与真实游戏相同的物理负载（第 1 关网格、4 源、240 示踪粒子），不含 GPU
      渲染。帧预算占比超 50%（红色）即该组件是本机掉帧主因。 参数：?seconds=秒数（2–60）
      · ?wasm=0 禁用 wasm 对比。
    </p>
    <script type="module" src="/src/dev/bench.ts"></script>
  </body>
</html>
